<!DOCTYPE html>
<html lang="en" data-theme="day">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Dashboard — Archery.Services</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
:root{--tw:#FFFFFF;--tb:#1A1A1A;--tbl:#0F5FA8;--tr:#D22730;--ty:#C9A227;--bg:#F5F7FA;--bg2:#FFFFFF;--ink:#0D1B2E;--dim:#334155;--faint:#8899AA;--line:rgba(15,95,168,.1);}
body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;margin:0;}
[data-theme="night"]{--bg:#0D1117;--bg2:#161B22;--ink:#E6EDF3;--dim:#8B949E;--faint:#4A5568;--line:rgba(255,255,255,.08);}
.page-hero{background:linear-gradient(135deg,#131316,#0F5FA8);padding:44px 24px 32px;text-align:center;color:#fff;}
.page-hero h1{font-family:'Oswald',sans-serif;font-size:clamp(26px,5vw,42px);font-weight:700;text-transform:uppercase;margin:0 0 8px;}
.page-hero h1 em{color:#C9A227;font-style:normal;}
.wrap{max-width:900px;margin:0 auto;padding:32px 24px 60px;}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin-bottom:20px;}
.card h2{font-family:'Oswald',sans-serif;font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:0 0 14px;}
.field-input{padding:10px 14px;border:1.5px solid var(--line);border-radius:6px;font-size:14px;font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);outline:none;}
.btn{padding:9px 18px;border:none;border-radius:6px;font-family:'Oswald',sans-serif;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;}
.btn-primary{background:#0F5FA8;color:#fff;}
.btn-gold{background:#C9A227;color:#1A1A1A;}
.btn-ghost{background:none;border:1.5px solid var(--line);color:var(--dim);}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap;}
.row:last-child{border-bottom:none;}
.badge{display:inline-block;padding:3px 9px;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--bg);color:var(--dim);border:1px solid var(--line);}
.badge-pending{background:rgba(201,162,39,.15);color:#8a6d16;border-color:transparent;}
.badge-active{background:rgba(34,197,94,.15);color:#16803C;border-color:transparent;}
.badge-revoked{background:rgba(210,39,48,.12);color:#B91C24;border-color:transparent;}
.msg{padding:10px 14px;border-radius:6px;font-size:12px;margin-top:8px;}
.msg-info{background:rgba(15,95,168,.1);color:#0F5FA8;}
.inline-form{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
</style>
</head>
<body>

<nav style="position:sticky;top:0;z-index:300;background:#fff;border-bottom:1px solid rgba(15,95,168,.1);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;column-gap:12px;padding:6px clamp(14px,4vw,32px);min-height:60px;">
  <a href="/" style="font-family:'Oswald',sans-serif;font-size:20px;font-weight:700;color:#0F5FA8;text-decoration:none;">Archery<span style="color:#C9A227">.</span>Services</a>
</nav>

<div class="page-hero">
  <h1>My <em>Dashboard</em></h1>
  <p style="color:rgba(255,255,255,.75);font-size:14px;max-width:520px;margin:0 auto;">Your athlete profile, coaching relationships, and officiating status — all in one place.</p>
</div>

<div class="wrap" id="dash-wrap">
  <div id="signed-out" class="card" style="display:none;text-align:center;padding:40px;">
    <p style="color:var(--faint);margin-bottom:14px;">Sign in to see your athlete, coach, and officiating status.</p>
    <a class="btn btn-primary" href="signin.html">Sign In</a>
  </div>
  <div id="dash-content" style="display:none;"></div>
</div>

<script src="esc.js"></script>
<script src="auth.js"></script>
<script>
let STATUS = null;

async function jpost(path, body){
  const r = await fetch('/api' + path, { method: 'POST', headers: { 'Content-Type': 'application/json', ...ArcheryAuth.authHeaders() }, body: JSON.stringify(body || {}) });
  return r.json().catch(() => ({ error: 'Network error' }));
}
async function jget(path){
  const r = await fetch('/api' + path, { headers: ArcheryAuth.authHeaders() });
  return r.json().catch(() => null);
}

async function loadStatus(){
  const [status, clubs] = await Promise.all([jget('/members/my-status'), jget('/members/my-clubs')]);
  STATUS = status;
  if (STATUS && STATUS.ok && clubs && clubs.ok) { STATUS.memberships = clubs.memberships; STATUS.pendingClubRequests = clubs.pendingRequests; }
  render();
}

function render(){
  const el = document.getElementById('dash-content');
  if (!STATUS || !STATUS.ok) { el.innerHTML = '<div class="card"><div class="msg msg-info">Could not load your status.</div></div>'; return; }

  let html = '';

  // ── CONSENT STATUS (minors only) — THREAT_MODEL.md T9 / PLAN.md 1.9's own
  // documented residual gap: the server has always enforced this fully
  // regardless of what the UI shows, but a blocked minor previously saw
  // only a bare 403 on whatever they tried to do, with nothing on this
  // page explaining WHY or what happens next. ──
  if (STATUS.isMinor) {
    html += '<div class="card"><h2>Account Status</h2>';
    if (STATUS.parentConsentStatus === 'granted') {
      html += '<div class="msg" style="background:rgba(34,197,94,.12);color:#16803C;">Your parent/guardian has confirmed consent. Your account has full access.</div>';
    } else if (STATUS.parentConsentStatus === 'denied') {
      html += '<div class="msg" style="background:rgba(210,39,48,.12);color:#B91C24;">Your parent/guardian did not grant consent. Coaching, tournament entry, and a public profile stay unavailable until they do — this is required by Indian law (the DPDP Act), not a setting you can change yourself.</div>';
    } else {
      html += '<div class="msg msg-info">Because you\'re under 18, we\'ve emailed your parent/guardian for consent — that\'s what unlocks connecting with a coach, entering a tournament, and having a public profile. Nothing further to do on your side; check back once they\'ve responded.</div>';
    }
    html += '<div class="msg msg-info" style="margin-top:8px;">Regardless of what they choose: we never show you personalised ads or track your activity for marketing — that protection is always on for an under-18 account and is not something consent changes.</div>';
    html += '</div>';
  }

  // ── ATHLETE ──
  html += '<div class="card"><h2>Athlete Profile</h2>';
  if (STATUS.athlete) {
    html += `<div class="row"><div>${esc(STATUS.athlete.name)}</div><span class="badge badge-active">linked</span></div>`;
  } else {
    html += `<div class="msg msg-info">You don't have an athlete profile yet.</div>
      <div class="inline-form">
        <button class="btn btn-gold" onclick="becomeAthlete()">Create my athlete profile</button>
      </div>
      <div class="inline-form">
        <input class="field-input" id="claim-athlete-id" type="number" placeholder="Existing athlete profile ID to claim">
        <button class="btn btn-ghost" onclick="claimAthlete()">Request claim</button>
      </div>`;
  }
  html += '</div>';

  // ── PARA CLASSIFICATION (if I'm an athlete) — DOMAIN.md §5: "classification-
  // first, not a badge." A confirmed status here is a real panel's outcome,
  // never something this platform assigns itself. ──
  if (STATUS.athlete) {
    html += '<div class="card"><h2>Para Classification</h2>';
    if (STATUS.classification) {
      const c = STATUS.classification;
      const statusLabel = { confirmed: 'Confirmed', review_nao: 'Review — next opportunity', review_frd: 'Review — fixed date', not_eligible: 'Not eligible' }[c.status] || c.status;
      html += `<div class="row"><div>${esc(c.sportClass || c.sport_class)} — ${esc(statusLabel)}</div><span class="badge badge-active">on record</span></div>
        <div class="match-sub" style="margin-top:4px;">Classified by: ${esc(c.classifiedBy || c.classified_by || '—')}${(c.reviewDueDate || c.review_due_date) ? ' · review due ' + esc(new Date(c.reviewDueDate || c.review_due_date).toLocaleDateString('en-IN')) : ''}</div>`;
    } else if (STATUS.pendingClassificationRequest) {
      html += `<div class="msg msg-info">Classification requested (${esc(STATUS.pendingClassificationRequest.sportClassRequested || STATUS.pendingClassificationRequest.sport_class_requested)}) — awaiting staff to record the panel's outcome.</div>`;
    } else {
      html += `<div class="msg msg-info">No classification on file. This does not classify you — it opens a request for staff to record a real classification panel's outcome (World Archery Para Archery Classification Rules, Art. 7).</div>
        <div class="inline-form">
          <select class="field-input" id="classification-sport-class">
            <option value="PI1">PI1 (physical)</option>
            <option value="PI2">PI2 (physical)</option>
            <option value="VI1">VI1 (vision)</option>
            <option value="VI2">VI2 (vision)</option>
          </select>
          <input class="field-input" id="classification-note" placeholder="Note — e.g. existing national classification (optional)">
          <button class="btn btn-gold" onclick="requestClassification()">Request classification</button>
        </div>`;
    }
    html += '</div>';
  }

  // ── MY CLUBS — memberships come from a club admin (or staff) approving a
  // request (migration 031); requesting one here never adds you automatically. ──
  html += '<div class="card"><h2>My Clubs</h2>';
  const memberships = STATUS.memberships || [];
  const pendingClubs = STATUS.pendingClubRequests || [];
  if (!memberships.length && !pendingClubs.length) {
    html += '<div class="msg msg-info">Not a member of any club yet. Request to join one from the Discover page.</div>';
  } else {
    memberships.forEach(m => {
      const clubId = m.clubId || m.club_id;
      const role = (m.memberRole || m.member_role || '').toLowerCase();
      // A club admin runs the roster/join queue; a coach runs sessions and
      // attendance for the same club — both get a "Manage" toggle here,
      // an archer-only membership does not (nothing to manage).
      const canManage = role === 'admin' || role === 'coach';
      html += `<div class="row"><div>${esc(m.clubName || m.club_name)}</div><div style="display:flex;gap:8px;align-items:center;">
        <span class="badge badge-active">${esc(role)}${(m.status||'').toLowerCase()==='inactive'?' · inactive':''}</span>
        ${canManage ? `<button class="btn btn-ghost" onclick="toggleClubManage(${clubId},'${role}')" id="manage-toggle-${clubId}">Manage</button>` : ''}
      </div></div>`;
      if (canManage) html += `<div id="manage-panel-${clubId}" style="display:none;padding:10px 0 4px 12px;border-left:2px solid var(--line);margin:4px 0 8px;"></div>`;
    });
    pendingClubs.forEach(p => { html += `<div class="msg msg-info" style="margin-top:6px;">Requested to join ${esc(p.clubName || p.club_name)} — awaiting the club admin.</div>`; });
  }
  html += '</div>';

  // ── MY COACHES (if I'm an athlete) ──
  if (STATUS.athlete) {
    html += '<div class="card"><h2>My Coaches</h2>';
    const coaches = STATUS.myCoaches || [];
    if (!coaches.length) html += '<div class="msg msg-info">No coaches linked yet.</div>';
    coaches.forEach(c => {
      const badgeClass = c.status === 'active' ? 'badge-active' : c.status === 'pending' ? 'badge-pending' : 'badge-revoked';
      let actions = '';
      if (c.status === 'pending' && c.requestedBy === 'coach' || c.status === 'pending' && c.requested_by === 'coach') {
        actions = `<button class="btn btn-gold" onclick="respondCoachLink(${c.id},true)">Accept</button><button class="btn btn-ghost" onclick="respondCoachLink(${c.id},false)">Decline</button>`;
      } else if (c.status === 'active') {
        actions = `<button class="btn btn-ghost" onclick="revokeCoachLink(${c.id})">Remove coach</button>`;
      }
      const licenseStatus = c.coachLicenseStatus || c.coach_license_status;
      const licenseLevel = c.coachLicenseLevel || c.coach_license_level;
      const licenseBadge = licenseStatus === 'approved'
        ? `<span class="badge badge-active" title="Coach license">${esc(licenseLevel)} licensed</span>`
        : `<span class="badge" style="opacity:.6;" title="No approved coach license on file">unlicensed</span>`;
      html += `<div class="row"><div>${esc(c.coachName || c.coach_name)} ${licenseBadge} <span class="badge ${badgeClass}">${esc(c.status)}</span></div><div>${actions}</div></div>`;
    });
    html += `<div class="inline-form">
      <input class="field-input" id="invite-coach-email" placeholder="Coach's email to invite">
      <button class="btn btn-primary" onclick="inviteCoach()">Invite coach</button>
    </div></div>`;
  }

  // ── COACHING (athletes I coach) ──
  html += '<div class="card"><h2>Athletes I Coach</h2>';
  const coaching = STATUS.coaching || [];
  if (!coaching.length) html += '<div class="msg msg-info">You are not coaching anyone yet.</div>';
  coaching.forEach(c => {
    const badgeClass = c.status === 'active' ? 'badge-active' : c.status === 'pending' ? 'badge-pending' : 'badge-revoked';
    let actions = '';
    if ((c.requestedBy === 'athlete' || c.requested_by === 'athlete') && c.status === 'pending') {
      actions = `<button class="btn btn-gold" onclick="respondCoachLink(${c.id},true)">Accept</button><button class="btn btn-ghost" onclick="respondCoachLink(${c.id},false)">Decline</button>`;
    } else if (c.status === 'active') {
      actions = `<button class="btn btn-ghost" onclick="revokeCoachLink(${c.id})">Stop coaching</button>`;
    }
    html += `<div class="row"><div>${esc(c.athleteName || c.athlete_name)} <span class="badge ${badgeClass}">${esc(c.status)}</span></div><div>${actions}</div></div>`;
  });
  html += `<div class="inline-form">
    <input class="field-input" id="request-coach-athlete-id" type="number" placeholder="Athlete's profile ID to coach">
    <button class="btn btn-primary" onclick="requestCoachLink()">Request to coach</button>
  </div>`;
  if (!STATUS.memberRole) html += `<div class="inline-form"><button class="btn btn-ghost" onclick="becomeCoach()">I'm a coach</button></div>`;
  html += '</div>';

  // ── COACH LICENSE — a separate credential from official/judge
  // certification below (migration 032): a coach can hold both. Requesting
  // it grants no capability by itself — coach-link still works either way —
  // this exists so the athlete/parent in "My Coaches" above sees something
  // real instead of a bare name. ──
  html += '<div class="card"><h2>Coach License</h2>';
  if (STATUS.coachLicense) {
    const cl = STATUS.coachLicense;
    const badgeClass = cl.status === 'approved' ? 'badge-active' : cl.status === 'pending' ? 'badge-pending' : 'badge-revoked';
    const issuingBody = cl.issuingBody || cl.issuing_body;
    html += `<div class="row"><div>${esc(cl.level)} level${cl.discipline ? ' · ' + esc(cl.discipline) : ''}${issuingBody ? ' · ' + esc(issuingBody) : ''}</div><span class="badge ${badgeClass}">${esc(cl.status)}</span></div>`;
  } else {
    html += `<div class="msg msg-info">No coach license on file. Requesting is optional but is what athletes/parents see before accepting a coach-link.</div>
      <div class="inline-form">
        <select class="field-input" id="coach-license-level"><option value="club">Club</option><option value="state">State</option><option value="national">National</option><option value="international">International</option></select>
        <select class="field-input" id="coach-license-discipline"><option value="">Any discipline</option><option value="recurve">Recurve</option><option value="compound">Compound</option><option value="barebow">Barebow</option></select>
        <input class="field-input" id="coach-license-body" placeholder="Issuing body (optional)">
        <button class="btn btn-gold" onclick="requestCoachLicense()">Request coach license</button>
      </div>`;
  }
  html += '</div>';

  // ── SAFEGUARDING CLEARANCE — recording that a REAL, externally-verified
  // background check/police verification/child-safety training exists
  // (migration 034). This platform does not perform or judge one; staff
  // verify the real document and record the outcome. ──
  html += '<div class="card"><h2>Safeguarding Clearance</h2>';
  const clearances = STATUS.safeguardingClearances || [];
  const CLEARANCE_LABEL = { background_check: 'Background check', police_verification: 'Police verification', child_safety_training: 'Child-safety training' };
  if (clearances.length) {
    clearances.forEach(cl => {
      const badgeClass = cl.status === 'approved' ? 'badge-active' : cl.status === 'pending' ? 'badge-pending' : 'badge-revoked';
      const issuingBody = cl.issuingBody || cl.issuing_body;
      html += `<div class="row"><div>${esc(CLEARANCE_LABEL[cl.clearanceType || cl.clearance_type] || (cl.clearanceType || cl.clearance_type))}${issuingBody ? ' · ' + esc(issuingBody) : ''}</div><span class="badge ${badgeClass}">${esc(cl.status)}</span></div>`;
    });
  } else {
    html += '<div class="msg msg-info">No safeguarding clearance on file yet.</div>';
  }
  html += `<div class="inline-form">
    <select class="field-input" id="clearance-type"><option value="background_check">Background check</option><option value="police_verification">Police verification</option><option value="child_safety_training">Child-safety training</option></select>
    <input class="field-input" id="clearance-body" placeholder="Issuing body">
    <input class="field-input" id="clearance-ref" placeholder="Reference number (optional)">
    <button class="btn btn-gold" onclick="requestSafeguardingClearance()">Request verification</button>
  </div></div>`;

  // ── OFFICIATING ──
  html += '<div class="card"><h2>Officiating</h2>';
  if (STATUS.certification) {
    const badgeClass = STATUS.certification.status === 'approved' ? 'badge-active' : STATUS.certification.status === 'pending' ? 'badge-pending' : 'badge-revoked';
    const issuingBody = STATUS.certification.issuingBody || STATUS.certification.issuing_body;
    html += `<div class="row"><div>${esc(STATUS.certification.level)} level${issuingBody ? ' · ' + esc(issuingBody) : ''}</div><span class="badge ${badgeClass}">${esc(STATUS.certification.status)}</span></div>`;
  } else {
    html += `<div class="msg msg-info">You have not requested judge/technical-delegate certification.</div>
      <div class="inline-form">
        <select class="field-input" id="cert-level"><option value="club">Club</option><option value="state">State</option><option value="national">National</option><option value="international">International</option></select>
        <input class="field-input" id="cert-body" placeholder="Issuing body (optional)">
        <button class="btn btn-gold" onclick="requestCertification()">Request certification</button>
      </div>`;
  }
  const assignments = STATUS.assignments || [];
  if (assignments.length) {
    html += '<div style="margin-top:12px;">';
    assignments.forEach(a => { html += `<div class="row"><div>${esc(a.eventName || a.event_name)}</div><span class="badge">${esc(a.role)}</span></div>`; });
    html += '</div>';
  }
  html += '</div>';

  el.innerHTML = html;
}

// shared.js's alert() override infers success/failure from KEYWORDS in the
// message (/sorry|could not|.../ -> red, else green) — a real server error
// like "Unknown link" matches none of them and renders as a green success
// toast, which is worse than no feedback at all. Call the toast API
// directly with an explicit tone instead (falls back to alert() if
// shared.js hasn't loaded yet for some reason).
function notify(msg, ok){
  if (window.ArcheryUI && window.ArcheryUI.toast) ArcheryUI.toast(msg, ok ? 'ok' : 'err');
  else alert(msg);
}

async function becomeAthlete(){ const r = await jpost('/members/become-athlete', {}); if (r && r.ok) { await loadStatus(); } else { notify((r && r.error) || 'Could not create profile.', false); } }
async function claimAthlete(){
  const athleteId = parseInt(document.getElementById('claim-athlete-id').value, 10);
  if (!athleteId) return;
  const r = await jpost('/members/claim-athlete', { athleteId });
  notify(r && r.ok ? 'Claim submitted — a staff member will review it.' : ((r && r.error) || 'Could not submit claim.'), !!(r && r.ok));
}
async function requestClassification(){
  const sportClass = document.getElementById('classification-sport-class').value;
  const note = document.getElementById('classification-note').value;
  const r = await jpost('/members/request-classification', { sportClass, note });
  if (r && r.ok) { await loadStatus(); } else { notify((r && r.error) || 'Could not submit request.', false); }
}
async function becomeCoach(){ const r = await jpost('/members/become-coach', {}); if (r && r.ok) { await loadStatus(); } else { notify((r && r.error) || 'Could not update your role.', false); } }
async function requestCoachLink(){
  const athleteId = parseInt(document.getElementById('request-coach-athlete-id').value, 10);
  if (!athleteId) return;
  const r = await jpost('/members/coach-link', { athleteId });
  if (r && r.ok) { await loadStatus(); } else { notify((r && r.error) || 'Could not send request.', false); }
}
async function inviteCoach(){
  const coachEmail = document.getElementById('invite-coach-email').value.trim();
  if (!coachEmail) return;
  const r = await jpost('/members/coach-link', { coachEmail });
  if (r && r.ok) { await loadStatus(); } else { notify((r && r.error) || 'Could not send invite.', false); }
}
async function requestSafeguardingClearance(){
  const clearanceType = document.getElementById('clearance-type').value;
  const issuingBody = document.getElementById('clearance-body').value;
  const referenceNumber = document.getElementById('clearance-ref').value;
  const r = await jpost('/members/request-safeguarding-clearance', { clearanceType, issuingBody, referenceNumber });
  if (r && r.ok) { await loadStatus(); } else { notify((r && r.error) || 'Could not submit request.', false); }
}
async function requestCoachLicense(){
  const level = document.getElementById('coach-license-level').value;
  const discipline = document.getElementById('coach-license-discipline').value;
  const issuingBody = document.getElementById('coach-license-body').value;
  const r = await jpost('/members/request-coach-license', { level, discipline, issuingBody });
  if (r && r.ok) { await loadStatus(); } else { notify((r && r.error) || 'Could not submit request.', false); }
}
async function respondCoachLink(linkId, accept){ const r = await jpost('/members/coach-link-respond', { linkId, accept }); if (r && r.ok) { await loadStatus(); } else { notify((r && r.error) || 'Could not respond to this request.', false); } }
async function revokeCoachLink(linkId){ const r = await jpost('/members/revoke-coach-link', { linkId }); if (r && r.ok) { await loadStatus(); } else { notify((r && r.error) || 'Could not remove this relationship.', false); } }
async function requestCertification(){
  const level = document.getElementById('cert-level').value;
  const issuingBody = document.getElementById('cert-body').value;
  const r = await jpost('/members/request-certification', { level, issuingBody });
  if (r && r.ok) { await loadStatus(); } else { notify((r && r.error) || 'Could not submit request.', false); }
}

// ── CLUB MANAGEMENT (admin/coach) — join requests + sessions/attendance.
// Loaded on demand, not on every dashboard visit: most members hold no
// club-admin/coach role, so eagerly fetching this for everyone would be a
// wasted round trip on the common case. ──
const CLUB_MANAGE = {};
async function toggleClubManage(clubId, role){
  const panel = document.getElementById('manage-panel-' + clubId);
  const btn = document.getElementById('manage-toggle-' + clubId);
  if (panel.style.display === 'block') { panel.style.display = 'none'; btn.textContent = 'Manage'; return; }
  panel.style.display = 'block';
  btn.textContent = 'Hide';
  await refreshClubManage(clubId, role);
}
// Reloads and re-renders an already-open manage panel — used both by the
// initial open (above) and after any mutation (approve/reject a join,
// add a session, save attendance) so the panel reflects reality rather
// than an optimistic guess at what just happened.
async function refreshClubManage(clubId, role){
  role = role || (CLUB_MANAGE[clubId] && CLUB_MANAGE[clubId].role) || 'coach';
  const panel = document.getElementById('manage-panel-' + clubId);
  const [pendingJoins, sessions] = await Promise.all([
    role === 'admin' ? jget('/members/pending-club-joins?clubId=' + clubId) : Promise.resolve([]),
    jget('/club-sessions?clubId=' + clubId),
  ]);
  CLUB_MANAGE[clubId] = { role, pendingJoins: Array.isArray(pendingJoins) ? pendingJoins : [], sessions: Array.isArray(sessions) ? sessions : [] };
  if (panel) panel.innerHTML = renderClubManage(clubId);
}
function renderClubManage(clubId){
  const state = CLUB_MANAGE[clubId] || { role: 'coach', pendingJoins: [], sessions: [] };
  let h = '';
  if (state.role === 'admin') {
    h += '<div style="font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin-bottom:6px;">Pending join requests</div>';
    if (!state.pendingJoins.length) h += '<div class="msg msg-info">None right now.</div>';
    state.pendingJoins.forEach(r => {
      h += `<div class="row"><div>${esc(r.name)} <span style="color:var(--faint);font-size:12px;">${esc(r.email || '')}</span></div><div>
        <button class="btn btn-gold" onclick="approveClubJoinReq(${r.id},true,${clubId})">Approve</button>
        <button class="btn btn-ghost" onclick="approveClubJoinReq(${r.id},false,${clubId})">Reject</button></div></div>`;
    });
  }
  h += '<div style="font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin:14px 0 6px;">Sessions</div>';
  if (!state.sessions.length) h += '<div class="msg msg-info">No sessions logged yet.</div>';
  state.sessions.forEach(s => {
    h += `<div class="row"><div>${esc(s.title)} <span style="color:var(--faint);font-size:12px;">${esc(s.sessionDate)}${s.startTime?(' · '+esc(s.startTime)):''}</span></div>
      <div><span class="badge badge-active">${s.presentCount} present</span> <span class="badge">${s.absentCount} absent</span>
      <button class="btn btn-ghost" onclick="openAttendance(${s.id},${clubId})">Take attendance</button></div></div>`;
  });
  h += `<div class="inline-form">
    <input class="field-input" id="new-session-title-${clubId}" placeholder="Session title (e.g. Saturday practice)">
    <input class="field-input" id="new-session-date-${clubId}" type="date">
    <button class="btn btn-primary" onclick="createClubSession(${clubId})">Add session</button>
  </div>`;
  return h;
}
async function approveClubJoinReq(requestId, approve, clubId){
  const r = await jpost('/members/approve-club-join', { requestId, approve });
  if (r && r.ok) await refreshClubManage(clubId);
  else notify((r && r.error) || 'Could not process this request.', false);
}
async function createClubSession(clubId){
  const title = document.getElementById('new-session-title-' + clubId).value.trim();
  const sessionDate = document.getElementById('new-session-date-' + clubId).value;
  if (!title || !sessionDate) { notify('A title and date are required.', false); return; }
  const r = await jpost('/club-sessions', { clubId, title, sessionDate });
  if (r && r.ok) await refreshClubManage(clubId);
  else notify((r && r.error) || 'Could not add the session.', false);
}

// ── ATTENDANCE modal — a lightweight overlay, matching the pattern used
// elsewhere in this codebase (e.g. seller.html's product editor) rather
// than a whole separate page for a rarely-open action. ──
let ATTENDANCE_SESSION = null;
async function openAttendance(sessionId, clubId){
  const detail = await jget('/club-sessions/' + sessionId);
  if (!detail || detail.error) { notify((detail && detail.error) || 'Could not load this session.', false); return; }
  ATTENDANCE_SESSION = { id: sessionId, clubId, roster: detail.roster };
  const ov = document.createElement('div'); ov.id = 'att-ov';
  ov.style.cssText = 'position:fixed;inset:0;z-index:9998;background:rgba(13,27,46,.6);display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto;';
  ov.innerHTML = `<div style="background:var(--bg2);border:1px solid var(--line);border-radius:12px;width:100%;max-width:480px;max-height:86vh;overflow:auto;padding:22px;">
    <h2 style="margin-bottom:12px;">Attendance — ${esc(detail.title)}</h2>
    <div id="att-rows"></div>
    <div style="display:flex;gap:10px;margin-top:16px;">
      <button class="btn btn-primary" onclick="saveAttendance()">Save attendance</button>
      <button class="btn btn-ghost" onclick="document.getElementById('att-ov').remove()">Close</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
  ov.addEventListener('click', e => { if (e.target === ov) ov.remove(); });
  renderAttendanceRows();
}
function setAttendanceStatus(memberId, status){
  // String comparison, not strict === : r.memberId arrives as a STRING
  // (bigint ids serialise as strings over JSON) but the onclick attribute
  // below interpolates it as a bare numeric literal, so a strict ===
  // between "14" and 14 always failed silently — clicking P/A/E updated
  // nothing. Real bug, caught by club-sessions-ui-test.js actually
  // clicking the buttons rather than only checking the API.
  const m = ATTENDANCE_SESSION.roster.find(r => String(r.memberId) === String(memberId));
  if (m) m.status = status;
  renderAttendanceRows();
}
function renderAttendanceRows(){
  const el = document.getElementById('att-rows');
  if (!el || !ATTENDANCE_SESSION) return;
  el.innerHTML = ATTENDANCE_SESSION.roster.map(r => {
    const opt = (v, label) => `<button class="btn ${r.status===v?'btn-gold':'btn-ghost'}" style="padding:6px 10px;" onclick="setAttendanceStatus(${r.memberId},'${v}')">${label}</button>`;
    return `<div class="row"><div>${esc(r.name)}</div><div style="display:flex;gap:6px;">${opt('present','P')}${opt('absent','A')}${opt('excused','E')}</div></div>`;
  }).join('');
}
async function saveAttendance(){
  const records = ATTENDANCE_SESSION.roster.filter(r => r.status).map(r => ({ memberId: r.memberId, status: r.status }));
  // jpost() is POST-only; attendance is a PUT, so call fetch directly here.
  const resp = await fetch('/api/club-sessions/' + ATTENDANCE_SESSION.id + '/attendance', {
    method: 'PUT', headers: { 'Content-Type': 'application/json', ...ArcheryAuth.authHeaders() },
    body: JSON.stringify({ records }),
  }).then(x => x.json()).catch(() => null);
  if (resp && resp.ok) {
    notify('Attendance saved (' + resp.recordsWritten + ' record' + (resp.recordsWritten === 1 ? '' : 's') + ')', true);
    document.getElementById('att-ov').remove();
    await refreshClubManage(ATTENDANCE_SESSION.clubId);
  } else {
    notify((resp && resp.error) || 'Could not save attendance.', false);
  }
}

(function init(){
  if (!ArcheryAuth.isLoggedIn()) { document.getElementById('signed-out').style.display = 'block'; return; }
  document.getElementById('dash-content').style.display = 'block';
  loadStatus();
})();
</script>
<script src="shared.js"></script>
